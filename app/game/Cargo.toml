[package]
name = "claw-game"
description = "The game executable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "claw_game"
path = "src/lib.rs"

[[bin]]
name = "rusty-claw"
path = "src/main.rs"

[features]
# Plays the game's movies through the pinned FFmpeg (`make ffmpeg`); off by
# default, and the Makefile turns it on when that build exists.
movies = ["claw-movie/ffmpeg"]

[dependencies]
claw-assets.workspace = true
claw-audio.workspace = true
claw-frame.workspace = true
claw-movie.workspace = true
claw-render.workspace = true
claw-sim.workspace = true
claw-ui.workspace = true
anyhow.workspace = true
clap.workspace = true
gilrs = "0.11.2"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
