# A route written down from a recording of a fast run, from Claw placed by
# the boss room's door, at 60 frames per second: both games run Raux's
# introduction (the written-down route keeps the door's fade as game
# time, so its jump comes long after the first room step). The
# checkpoint the stager sets is 1 px further on in the game (an event's
# position is compared exactly; the first room tick walks 5 px instead of
# 4 at 60 frames per second), and the camera's pan drifts from 1117 ms.
[[compare]]
reference = "level2/video-segment"
clock = "c60"
tolerance = "feel"
known.events = 400
known.cam_x = 1117

# Raux's room from Claw placed by its door, walking in: the introduction,
# then a fight with no input. One 18 ms step per frame: Claw's position,
# the trigger, the flag and the introduction's steps are the original's;
# the random stream first differs at 9396 ms, in the introduction, for a
# reason not traced yet (the introduction played from the level's start,
# on the second level's bot route, is equal throughout).
[[compare]]
reference = "level2/boss-intro-normal"
clock = "c18"
tolerance = "exact"
known.rng = 9396

# The same at 60 frames per second: the first room tick walks 5 px
# instead of 4, so the trigger's checkpoint is 1 px further on (667 ms);
# the camera's pan and the introduction's delays count 18 ms ticks
# against frames of 16 and 17 ms, so the pan drifts (1500 ms) and the
# flag reaches 2 about 350 ms later (12200 ms).
[[compare]]
reference = "level2/boss-intro-normal"
clock = "c60"
tolerance = "feel"
known.events = 667
known.cam_x = 1500
known.boss_fight = 12200
known.state_id = 12217
known.health = 30083

# The jump-in entry that skips the introduction, one 18 ms step per frame:
# the flag stays 0, Raux waits in his start-up state, and Claw lands on
# the original's step. The random stream first differs at 9396 ms (as for
# `level2/boss-intro-normal`), and from 24318 ms Raux's choices differ.
[[compare]]
reference = "level2/boss-intro-skip-c18"
clock = "c18"
tolerance = "exact"
known.rng = 9396
known.state_id = 24318
known.health = 24318
known.x = 24336
known.cam_x = 24336

# The jump-in at 60 frames per second: the jump's arc is up to 9 px lower
# after the timing slack (967 ms), and Claw still lands short of every
# range box, so Raux stays in his start-up state for the whole run as in
# the original.
[[compare]]
reference = "level2/boss-intro-skip"
clock = "c60"
tolerance = "feel"
known.y = 967
known.cam_y = 967

# A jump one tick too late to skip the introduction, one 18 ms step per
