[[compare]]
reference = "level1/bot-original-delay1"
clock = "c18"
tolerance = "exact"
known.rng = 25812
known.state_id = 24858
known.physics_type = 24858
known.x = 24858
known.cam_x = 24858
known.y = 25056
known.cam_y = 25056
known.health = 26244
known.score = 25722
known.events = 33246
known.lives = 36036

# The bot's route (default tuning) with one empty row first, at 60 frames
# per second. At 550 ms the jump key is pressed on the frame Claw lands in
# the original, where the press is spent while he still falls; the game
# landed a tick earlier and jumps. A route played without looking at the
# game goes another way from there.
[[compare]]
reference = "level1/bot-delay1"
clock = "c60"
tolerance = "feel"
known.state_id = 550
known.physics_type = 550
known.y = 600
known.cam_y = 600
known.x = 1050
known.cam_x = 1050
known.score = 4534
known.events = 7830
known.health = 86667

# A segment of the bot's route (original speeds) from row 3410, with Claw
# placed at 10355,2051 and left to settle, and the random stream set at
# the segment's time zero. Claw's movement is equal tick for tick for
# 13.6 s, until a standing attack holds Claw for 21 steps in the original
# and 8 in the game (the attack's variant is drawn from the random stream,
# which first differs at 18 ms, the segment's first tick: the original
# draws nothing there, the game draws one number). The coins an officer drops at
# 11700 ms fly with speeds drawn from that stream, so Claw takes them at
# other times: 36 ms before the original since rule 2 (the dropped coins
# now first move in the tick they are made), 18 ms after it before.
[[compare]]
reference = "level1/bot-original-seg3410"
clock = "c18"
tolerance = "exact"
known.rng = 18
known.x = 13590
known.cam_x = 13590
known.state_id = 13590
known.physics_type = 13590
known.y = 14238
known.cam_y = 14238
known.health = 14814
known.score = 11970
known.events = 19188
known.lives = 27702

# The bot's route of the first level before the draws took the original's
# schedule (the previous tests/acceptance/routes/level1-original.csv,
# original speeds), one 18 ms step per frame from the original's random
# state at time zero. The random stream first differs at 51516 ms; until
# then the game draws the same numbers as the original, step for step: the
# crates near the start roll from 162 ms (rule 1), the back stacks' crates
# in the step they wake (rule 2), the glitters and the ambient timers draw
# in the original's steps (rules 3 and 4), a pacing officer draws at its
# limit in the original's step (rule 5) and a woken officer leaves its
# window again at once (rule 6). So an officer's sword hits Claw at
# 8586 ms in both games (health 90), and Claw's position, state and the
# camera are equal tick for tick until 51552 ms. At 51516 ms an officer
# falls in the original (eleven draws in the step: its hit burst, its loot
# and its death), while in the game it stands and its sword hits Claw at
# 51552 ms (health 60); the route goes another way from there.
[[compare]]
reference = "level1/bot-original-v2"
clock = "c18"
tolerance = "exact"
known.rng = 51516
known.state_id = 51552
known.physics_type = 51552
known.health = 51552
known.x = 52560
known.cam_x = 52560
known.y = 51570
known.cam_y = 51570
known.score = 51642
known.pistol = 51642

# The bot's route before the draws took the original's schedule (the
# previous tests/acceptance/routes/level1.csv, default tuning) at 60
# frames per second. A route played without looking
# at the game is compared for feel stretch by stretch here and need not
# finish the level: the 16 and 17 ms frames against the game's 18 ms
# ticks move Claw by a few pixels and a frame or two (the first fall off
# the start step is 26 px apart at 684 ms, within two ticks of timing).
# These add up until the game reaches the ladder near 2.8 s about 45 ms
# after the original, jumps off it about 35 ms later, and is 20 px lower
# in that jump at 3217 ms, beyond the two ticks of timing the feel
# tolerance allows. From there the two runs go different ways: the
# original ends against the wall right of the start (1814,4794), and the
# game, which finished the level on this route before, now loses a life
# at 106 s (with the draws in the original's order, rules 1 to 7, the
# enemies along its way choose differently).
[[compare]]
reference = "level1/bot-v2"
clock = "c60"
tolerance = "feel"
known.y = 3217
known.cam_y = 3217
known.state_id = 3784
known.physics_type = 3784
known.x = 3867
known.cam_x = 3867
known.score = 4300
known.events = 7560
known.health = 39784
known.lives = 106000
