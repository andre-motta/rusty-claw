clock = "c18"
tolerance = "exact"
known.rng = 162
known.state_id = 24858
known.physics_type = 24858
known.x = 24858
known.cam_x = 24858
known.y = 25056
known.cam_y = 25056
known.health = 26244
known.score = 25722
known.events = 33246
known.lives = 36036

# The bot's route (default tuning) with one empty row first, at 60 frames
# per second. At 550 ms the jump key is pressed on the frame Claw lands in
# the original, where the press is spent while he still falls; the game
# landed a tick earlier and jumps. A route played without looking at the
# game goes another way from there.
[[compare]]
reference = "level1/bot-delay1"
clock = "c60"
tolerance = "feel"
known.state_id = 550
known.physics_type = 550
known.y = 600
known.cam_y = 600
known.x = 1050
known.cam_x = 1050
known.score = 4534
known.events = 7830
known.health = 86667

# A segment of the bot's route (original speeds) from row 3410, with Claw
# placed at 10355,2051 and left to settle, and the random stream set at
# the segment's time zero. Claw's movement is equal tick for tick for
# 13.6 s, until a standing attack holds Claw for 21 steps in the original
