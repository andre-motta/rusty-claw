# The throw routes of the first level, one 18 ms step per frame from where
# the original's Claw stood at the route's time zero: a powder keg lifted
# on the long upper floor and thrown with a tap of the lift key, or with
# the key held 0.5 s, 1.5 s, 3 s and 3.6 s (past the 3 s limit, so the keg
# leaves by itself at full power), and the lift key held from the lift on
# with no second press (no throw). Claw's position, state and stats are
# equal on every row of every route: the wind-up while the key is down,
# the release on the first tick without it and the 21 ticks of the throw
# picture before he stands. install_throw checks the keg's flight against
# the original's (the release, the peak and the landing at Y 2102, every
# row equal). The random stream differs from the first tick: Claw is put
# down where the original's Claw had already settled, so the game's
# settling is shorter than the original's and the objects around him and
# the frame pulse start from other states. The blast's screen shake draws
# its jolts from that stream, so the camera differs from the shake's first
# tick on.
[[compare]]
reference = "level1/throw-keg_tap"
clock = "c18"
tolerance = "exact"
known.rng = 18
known.cam_x = 2376
known.cam_y = 2376

