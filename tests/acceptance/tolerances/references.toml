# An officer on the lower floor lifted and thrown with a tap of the lift
# key. The store's start point is where the original put Claw before he
# settled; its officer struck him then, taking 10 health and pushing him
# 27 px left, before the route's time zero. The game's officer does not,
# so Claw stands 27 px further right with 10 health more from the first
# row (his x and the camera's), and a coin the officer drops when it dies
# reaches him there at 4950 ms. His state is equal on every row: he walks
# up, lifts, winds up, throws and stands on the original's ticks.
# install_throw plays the route from the original's settled point and
# checks the officer's flight, landing speed and bounces against the
# original's, every row equal.
[[compare]]
reference = "level1/throw-officer_tap"
clock = "c18"
tolerance = "exact"
known.x = 18
known.cam_x = 18
known.health = 18
known.rng = 630
known.score = 4950

