# Routes the install tests compare with their reference traces (README.md
# explains the clocks and the files): `install_reference` plays them tick
# by tick, and `install_differential`, the gate, plays them through the
# game's frame loop at 60 Hz and compares c18 runs with exact.toml and c60
# runs with feel.toml.
#
# Each [[compare]] entry names a route in the reference store
# ($CLAW_REFERENCE/<reference>/), the clock of the reference runs (c18 or
# c60) and the tolerance file (exact or feel). `known.<column> = <ms>`
# records the reference time at which a column is already known to leave
# its tolerance; the test fails when a column leaves it earlier, or when a
# column with no known divergence leaves it at all. When a known divergence
# comes later or goes away, the test says so and the entry is tightened.
#
# Every entry records the first divergences the game gives today against
# the routes as stored: keys down when play starts count only once
# released and pressed again, the level's objects draw from the random
# stream in the original's order (set up while the level loads, the
# enemies' per-tick roll every third step), and Claw climbs up at 220 px/s
# with the default tuning. The entries are replaced once the original has
# played the new routes.

# The first level's opening, one 18 ms step per frame against the original
# speeds and the original's random state at time zero. The random stream
# is equal tick for tick until 2268 ms, where an enemy draw still comes in
# another order. Claw's movement and the camera are equal until 16776 ms:
# an officer's sword hits Claw in the game while in the original it
# misses him (the officer's choices follow the random stream; with the
# draws in the original's order the strike that hit at 16416 ms is gone,
# this one is not). After the strike Claw stands nearer the officer, who
# falls about 400 ms earlier in the game (the score at 17532 ms).
[[compare]]
reference = "level1/opening"
clock = "c18"
tolerance = "exact"
known.x = 16794
known.y = 22482
known.state_id = 16776
known.physics_type = 16776
known.cam_x = 16794
known.cam_y = 22482
known.health = 16776
known.score = 17532
known.rng = 2268

# The same route at 60 frames per second against the default tuning.
# Claw climbs the ladder as fast as the original (220 px/s) and stays
# within the feel tolerance until the officer's sword hits Claw in the
# original at 16384 ms; the game's officer strikes a few ticks later
# (16470 ms) and then falls to Claw at 18054 ms, while the original's
# officer goes on striking (its choices follow the random stream, which
# still differs here).
[[compare]]
reference = "level1/opening"
clock = "c60"
tolerance = "feel"
known.x = 16450
known.y = 16450
known.state_id = 16384
known.physics_type = 16484
known.cam_x = 16450
known.cam_y = 16450
known.health = 16384
known.score = 18084

# The bot's winning route of the first level (original speeds), one 18 ms
# step per frame. The route presses Right and Jump on its first row; the
# original and the game alike ignore them until they are released and
# pressed again, so Claw's movement is equal tick for tick until 27360 ms,
# where a standing attack holds Claw longer in the original (the attack's
# variant is drawn from the random stream, equal until 540 ms).
[[compare]]
reference = "level1/bot-original"
clock = "c18"
tolerance = "exact"
known.x = 93834
known.y = 95130
known.state_id = 27360
known.physics_type = 27360
known.cam_x = 93834
known.cam_y = 95130
known.score = 94014
known.rng = 540

# The bot's winning route of the first level (default tuning) at 60 frames
# per second: Claw stands still until the keys held from the start are
# released and pressed again, in both games, and stays within the feel
# tolerance until a landing at 2017 ms comes a frame earlier in the game
# (a fall at the default tuning). Not required to finish the level.
[[compare]]
reference = "level1/bot"
clock = "c60"
tolerance = "feel"
known.x = 3100
known.y = 2017
known.state_id = 5050
known.physics_type = 5050
known.cam_x = 3100
known.cam_y = 2017

# A route written down from a recording of a fast run of the first level,
# at 60 frames per second. It never climbs out of the start area, in the
# original and the game alike. A short climb from 2880 ms ends 3 px lower
# in the game at 220 px/s (the original climbs 39 px there, the game 35),
# so the fall after the next jump leaves the feel tolerance at 4350 ms; a
# running jump with the jump key held part of the way peaks 11 px lower in
# the game's default tuning (6050 ms); from about 68 s Claw stands at a
# wall in both games at slightly different points, and the game, a jump
# ahead, collects the 5000 points the original collects about 430 ms
# later (with the draws in the original's order the game collects them at
# all).
[[compare]]
reference = "level1/video"
clock = "c60"
tolerance = "feel"
known.y = 4350
known.cam_y = 4350
known.state_id = 6050
known.physics_type = 6050
known.x = 68000
known.cam_x = 68000
known.score = 69250

# The same route, one 18 ms step per frame against the original speeds:
# the random stream is equal until 216 ms, and Claw's movement is equal
# tick for tick for 54.7 s, until a standing attack holds Claw for 21
# steps in the original and 8 in the game (the attack's variant is drawn
# from the random stream). The route's timing follows from there.
[[compare]]
reference = "level1/video"
clock = "c18"
tolerance = "exact"
known.rng = 216
known.state_id = 54774
known.physics_type = 54774
known.y = 57726
known.cam_y = 57726
known.x = 68094
known.cam_x = 68094
known.score = 73242

