# Routes the install tests compare with their reference traces (README.md
# explains the clocks and the files): `install_reference` plays them tick
# by tick, and `install_differential`, the gate, plays them through the
# game's frame loop at 60 Hz and compares c18 runs with exact.toml and c60
# runs with feel.toml.
#
# Each [[compare]] entry names a route in the reference store
# ($CLAW_REFERENCE/<reference>/), the clock of the reference runs (c18 or
# c60) and the tolerance file (exact or feel). `known.<column> = <ms>`
# records the reference time at which a column is already known to leave
# its tolerance; the test fails when a column leaves it earlier, or when a
# column with no known divergence leaves it at all. When a known divergence
# comes later or goes away, the test says so and the entry is tightened.
#
# Every entry records the first divergences the game gives today against
# the routes as stored: keys down when play starts count only once
# released and pressed again, the level's objects are set up while the
# level loads so their first draws come in the original's order, and
# Claw climbs up at 220 px/s with the default tuning. The random draws
# follow the original's schedule: (1) the small objects' window (crates,
# kegs, pickups) is 831x623; (2) an object made in the update pass joins
# the live list at once and runs in the same pass when it lands after the
# object the pass visits next; (3) a pickup's glitter draws its delay when
# the pass reaches it, not when it is made; (4) the ambient sounds' timers
# run once per tick after the rest of it, from the first tick; (5) a
# pacing enemy is at a limit only when its exact position is; (6) a woken
# enemy first moves for the time it slept, at most 200 ms; (7) Claw's hit
# burst draws its y jitter before its x jitter. Ten more rules keep the
# game in step with the original along whole routes: (8) a goodie (an item
# a crate or an enemy drops) spins through its set while it flies and is
# armed with the box of the picture it shows then; (9) a goodie moves on an
# exact position, one tick of constant acceleration at a time; (10) a
# goodie moves with its picture's box grown 10 px left, up and right, and
# a wall on either side turns it around at half speed; (11) each call a
# goodie first acts on what its previous move left (a landing, the fourth
# bounce); (12) a save point leaves the random stream at the save's own
# state; (13) the ambient timers count no time in the tick of a save; (14)
# a human enemy placed outside its patrol limits starts on the nearer
# limit; (15) a lying keg sorts its depth against Claw's feet like the
# enemies; (16) standing, Claw starts a walk on the press of Right or
# Left, and an attack's end or cancel makes a direction still held count
# as pressed on the next tick; (17) a lost life with lives left ends the
# tick with Claw dead and he respawns before the next tick, the circles
# drawn outside game time. Three more hold whole routes to the end: (18)
# a walker that a wall turned turns again with that speed truncated, which
# leads back into the wall, so it stays on the wall's limit walking the
# other way; (19) a goodie's bounce lifts its exact height by 1.0 and
# keeps the fraction; (20) the respawn runs an update pass, wakes the
# objects around Claw and runs a second pass, all at the time of the
# death. The comparison itself takes a reference step of no game time
# (the original's step of a save, `dt_ms` 0) as the instant at its time,
# so the save's checkpoint is found in both traces. The rule numbers below
# refer to this list.
#
# The last two entries (`level1/bot-original-v4` and `level1/bot-v4`) are
# the original's runs of the routes that were in tests/acceptance/routes/
# before rules 18 to 20, and are the ones to read first: at one 18 ms step
# per frame the game equals the original on every compared row of
# `level1/bot-original-v4`, events included. That route loses a life in
# the original, as it now does in the game (it was planned while the rat
# by x 12381 turned away from its wall, before rule 18), so the routes
# were found again by the bot. The entries before them hold runs of
# earlier routes and stay as further checks; they are never replaced, only
# tightened. With rules 8 to 20, six of the eight `c18` stores
# (`level1/opening`, `level1/bot-original`, `level1/video`,
# `level1/bot-original-v2`, `level1/bot-original-v3` and
# `level1/bot-original-v4`) are equal to the original in every column of
# every compared row, random stream and events included. The other two
# (`level1/bot-original-delay1` and `level1/bot-original-seg3410`) keep
# the steps listed in their entries.

# The first level's opening, one 18 ms step per frame against the original
# speeds and the original's random state at time zero. Equal on every row,
# random stream included: the stream's first difference at 7506 ms (at
# 2268 ms before rules 1 to 3) was the kegs' depth (rule 15: they roll
# before Claw), and the officer's coins are taken in the original's tick
# with the goodies' spin (rule 8; the score differed at 17946 ms).
[[compare]]
reference = "level1/opening"
clock = "c18"
tolerance = "exact"

# The same route at 60 frames per second against the default tuning.
# Claw climbs the ladder as fast as the original (220 px/s) and stays
# within the feel tolerance until 16934 ms (it was 16384 ms before rules 1
# to 3): with the draws in the original's order the officer's strikes come
# as in the original until then, and Claw is hit about 550 ms after it,
# at 17350 ms (the 60 Hz frames still reach the officer's choices at other
# moments than the original's frames do). The score stays equal.
[[compare]]
reference = "level1/opening"
clock = "c60"
tolerance = "feel"
known.x = 17400
known.y = 22584
known.state_id = 16934
known.physics_type = 16934
known.cam_x = 17400
known.cam_y = 22584
known.health = 17350

# The bot's winning route of the first level (original speeds), one 18 ms
# step per frame. The route presses Right and Jump on its first row; the
# original and the game alike ignore them until they are released and
# pressed again. Equal on every row, random stream included: the stream's
# first difference at 24678 ms was the kegs' depth (rule 15; at 540 ms
# before rule 1), and the standing attack that held Claw longer in the
# original at 27378 ms was the walk start on the press of a direction
# (rule 16).
[[compare]]
reference = "level1/bot-original"
clock = "c18"
tolerance = "exact"

# The bot's winning route of the first level (default tuning) at 60 frames
# per second: Claw stands still until the keys held from the start are
# released and pressed again, in both games, and stays within the feel
# tolerance until a landing at 2017 ms comes a frame earlier in the game
# (a fall at the default tuning). Not required to finish the level; the
# route goes another way from there, and with the walk start on the press
# of a direction (rule 16) the score differs at 86850 ms too.
[[compare]]
reference = "level1/bot"
clock = "c60"
tolerance = "feel"
known.x = 3100
known.y = 2017
known.state_id = 5050
known.physics_type = 5050
known.cam_x = 3100
known.cam_y = 2017
known.score = 86850

# A route written down from a recording of a fast run of the first level,
# at 60 frames per second. It never climbs out of the start area, in the
# original and the game alike. A short climb from 2880 ms ends 3 px lower
# in the game at 220 px/s (the original climbs 39 px there, the game 35),
# so the fall after the next jump leaves the feel tolerance at 4350 ms; a
# running jump with the jump key held part of the way peaks 11 px lower in
# the game's default tuning (6050 ms); from about 68 s Claw stands at a
# wall in both games at slightly different points. The score stays within
# the feel tolerance: the 5000 points the game collected about 430 ms
# before the original (69250 ms) now come in time, with the walk start on
# the press of a direction (rule 16) and the kegs' depth (rule 15).
[[compare]]
reference = "level1/video"
clock = "c60"
tolerance = "feel"
known.y = 4350
known.cam_y = 4350
known.state_id = 6050
known.physics_type = 6050
known.x = 68000
known.cam_x = 68000

# The same route, one 18 ms step per frame against the original speeds.
# Equal on every row, random stream included: the stream's first
# difference at 5346 ms (at 216 ms before rules 1 and 2) was the kegs'
# depth (rule 15), and the standing attack that held Claw for 21 steps in
# the original and 8 in the game at 54774 ms was the walk start on the
# press of a direction (rule 16).
[[compare]]
reference = "level1/video"
clock = "c18"
tolerance = "exact"

# The bot's route (original speeds) with one empty row first, so its keys
# are pressed after play starts. The standing attack that held Claw
# longer in the original at 24858 ms was the walk start on the press of a
# direction (rule 16), and the life lost at 36054 ms now ends its tick
# with Claw back at the checkpoint before the next (rule 17), as in the
# original. The random stream first differs at 47052 ms (25812 ms before
# rules 16 and 17), where Claw has stood since his respawn: the game draws
# one of the two numbers the original draws in the next step a step early
# (not traced yet). Claw's movement is equal tick for tick until
# 52452 ms.
[[compare]]
reference = "level1/bot-original-delay1"
clock = "c18"
tolerance = "exact"
known.rng = 47052
known.state_id = 52452
known.physics_type = 54846
known.x = 52470
known.cam_x = 52470
known.y = 69768
known.cam_y = 70704
known.health = 52452
known.score = 75780
known.events = 70686
known.lives = 70686

# The bot's route (default tuning) with one empty row first, at 60 frames
# per second. At 550 ms the jump key is pressed on the frame Claw lands in
# the original, where the press is spent while he still falls; the game
# landed a tick earlier and jumps. A route played without looking at the
# game goes another way from there; with the walk start on the press of a
# direction (rule 16) Claw is hurt at 22700 ms (86667 ms before) and loses
# a life at 31584 ms on the way the game goes.
[[compare]]
reference = "level1/bot-delay1"
clock = "c60"
tolerance = "feel"
known.state_id = 550
known.physics_type = 550
known.y = 600
known.cam_y = 600
known.x = 1050
known.cam_x = 1050
known.score = 4534
known.events = 7830
known.health = 22700
known.lives = 31584

# A segment of the bot's route (original speeds) from row 3410, with Claw
# placed at 10355,2051 and left to settle, and the random stream set at
# the segment's time zero. The random stream first differs at 18 ms, the
# segment's first tick: the original draws nothing there, the game draws
# one number. Claw's movement is equal tick for tick for 19.6 s (13.6 s
# before rule 16, when a standing attack held Claw for 21 steps in the
# original and 8 in the game). The coins an officer drops at 11700 ms fly
# with speeds drawn from that stream; with the goodies' spin (rule 8) and
# the soldier's start on its limit (rule 14) the score holds until
# 16200 ms (11970 ms before).
[[compare]]
reference = "level1/bot-original-seg3410"
clock = "c18"
tolerance = "exact"
known.rng = 18
known.x = 19638
known.cam_x = 19638
known.state_id = 19620
known.physics_type = 19620
known.y = 21564
known.cam_y = 21564
known.health = 19134
known.score = 16200
known.events = 22230
known.lives = 44154

# The bot's route of the first level before the draws took the original's
# schedule (an earlier tests/acceptance/routes/level1-original.csv,
# original speeds), one 18 ms step per frame from the original's random
# state at time zero. Equal on every row, random stream included: the
# officer that fell in the original at 51516 ms while it stood in the game
# (its sword hit Claw at 51552 ms) was the kegs' depth (rule 15), which
# changed the order of the step's draws.
[[compare]]
reference = "level1/bot-original-v2"
clock = "c18"
tolerance = "exact"

# The bot's route before the draws took the original's schedule (the
# previous tests/acceptance/routes/level1.csv, default tuning) at 60
# frames per second. A route played without looking
# at the game is compared for feel stretch by stretch here and need not
# finish the level: the 16 and 17 ms frames against the game's 18 ms
# ticks move Claw by a few pixels and a frame or two (the first fall off
# the start step is 26 px apart at 684 ms, within two ticks of timing).
# These add up until the game reaches the ladder near 2.8 s about 45 ms
# after the original, jumps off it about 35 ms later, and is 20 px lower
# in that jump at 3217 ms, beyond the two ticks of timing the feel
# tolerance allows. From there the two runs go different ways: the
# original ends against the wall right of the start (1814,4794), and the
# game, with the walk start on the press of a direction (rule 16), is
# hurt at 22067 ms and loses a life at 30750 ms on its own way (39784 ms
# and 106 s before).
[[compare]]
reference = "level1/bot-v2"
clock = "c60"
tolerance = "feel"
known.y = 3217
known.cam_y = 3217
known.state_id = 3784
known.physics_type = 3784
known.x = 3867
known.cam_x = 3867
known.score = 4300
known.events = 7560
known.health = 22067
known.lives = 30750

# The bot's route of the first level before rules 8 to 17 (an earlier
# tests/acceptance/routes/level1-original.csv, original speeds), one 18 ms
# step per frame from the original's random state at time zero. Equal on
# every compared row (6691 steps, 120.4 s): Claw's position, state,
# physics type, health, score, lives, ammunition, the camera, the random
# stream and the events, the life lost on the death tiles at 97002 ms and
# the respawn included. The events first differed at 36450 ms, the save's
# step of no game time in the original's trace (now compared as the
# instant at its time). The respawn wakes the officer and the soldier by
# the checkpoint between its two passes (rule 20): they run once in it,
# and the random stream holds.
[[compare]]
reference = "level1/bot-original-v3"
clock = "c18"
tolerance = "exact"

# The bot's route of the first level before rules 8 to 17 (an earlier
# tests/acceptance/routes/level1.csv, default tuning) at 60 frames per
# second. It starts as the route of `level1/bot-v2` does, and leaves the
# feel tolerance the same way, 20 px lower in the jump off the ladder at
# 3217 ms; the runs go different ways from there, and the game, with the
# walk start on the press of a direction (rule 16), is hurt at 22084 ms
# and loses a life at 30817 ms on its own way.
[[compare]]
reference = "level1/bot-v3"
clock = "c60"
tolerance = "feel"
known.y = 3217
known.cam_y = 3217
known.state_id = 3784
known.physics_type = 3784
known.x = 3867
known.cam_x = 3867
known.score = 4300
known.events = 7560
known.health = 22084
known.lives = 30817

# The bot's route of the first level before rules 18 to 20 (an earlier
# tests/acceptance/routes/level1-original.csv, original speeds), one 18 ms
# step per frame from the original's random state at time zero. Equal on
# every compared row (6452 steps, 116.1 s), the random stream and the
# events included. The random stream first differed at 79542 ms before
# rule 18: the rat that ran into a wall at x 12381 at 77346 ms stays there
# in the original, walking left with its speed pointing right, and rolls
# again when it comes back into reach; in the game it had turned away.
# With the rat held there Claw is hit at 106182 ms and loses a life at
# 113418 ms in both games, and the route does not finish the level. The
# goodie's bounce (rule 19, 83826 ms) and the respawn's second pass (rule
# 20, 114282 ms) each first differed in the random stream for a step; the
# events first differed at 36144 ms, the save's step of no game time.
[[compare]]
reference = "level1/bot-original-v4"
clock = "c18"
tolerance = "exact"

# The bot's route of the first level before rules 18 to 20 (an earlier
# tests/acceptance/routes/level1.csv, default tuning) at 60 frames per
# second. It starts as the routes of `level1/bot-v2` and `level1/bot-v3`
# do, and first differs at 3217 ms the same way, 20 px lower in the jump
# off the ladder; the runs go different ways from there, and Claw's
# health first differs at 39584 ms.
[[compare]]
reference = "level1/bot-v4"
clock = "c60"
tolerance = "feel"
known.y = 3217
known.cam_y = 3217
known.state_id = 3784
known.physics_type = 3784
known.x = 3867
known.cam_x = 3867
known.score = 4300
known.events = 7560
known.health = 39584
