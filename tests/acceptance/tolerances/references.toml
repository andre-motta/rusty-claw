# The fourth level's fern routes, one 18 ms step per frame, from Claw put
# down beside the first fern: standing on it, Jump held throughout,
# walking on it, and walking off it before the throw. The route starts as
# soon as Claw has settled, earlier on the level clock than the
# original's run started (828 ms), and that clock times the level's
# sounds that come and go and the floor spikes by the fern. Claw's
# position and state are equal on every row of the first three: thrown
# on the 21st tick on the fern to 450 px, every time. The original's
# camera is still catching up with Claw on the first five rows (cam_x),
# and the timed bird calls draw from the random stream at 13104 ms in the
# original (13932 ms on its level clock) and some rows later in the game.
# Walking off, Claw walks over the floor spikes left of the fern: they
# strike him at 1206 ms in the game and at 2646 ms in the original, and
# the runs go different ways from there. engine/sim's
