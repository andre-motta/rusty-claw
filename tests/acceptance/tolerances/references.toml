# (a fall at the default tuning). Not required to finish the level; the
# route goes another way from there, and with the walk start on the press
# of a direction (rule 16) the score differs at 86850 ms too.
[[compare]]
reference = "level1/bot"
clock = "c60"
tolerance = "feel"
known.x = 3100
known.y = 2017
known.state_id = 5050
known.physics_type = 5050
known.cam_x = 3100
