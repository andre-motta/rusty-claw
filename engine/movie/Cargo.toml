[package]
name = "claw-movie"
description = "The game's movies: finding them and, where FFmpeg is linked, decoding them through a pinned FFmpeg build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Kept for old commands and does nothing: FFmpeg is linked whenever the
# rusty_ffmpeg build script finds or builds it (third_party/ffmpeg), and
# build.rs then sets the `claw_ffmpeg` cfg.
ffmpeg = []

[dependencies]
claw-audio.workspace = true
rtrb = "0.4"
rusty_ffmpeg.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
