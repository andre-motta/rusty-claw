# rusty_ffmpeg 0.17.0+ffmpeg.8.1 (https://github.com/CCExtractor/rusty_ffmpeg,
# MIT, see LICENSE): its FFI declarations for FFmpeg 8.1, unchanged in src/,
# with the build script replaced so that it links the pinned static FFmpeg
# from third_party/ffmpeg/build.sh and needs neither libclang nor environment
# variables. See ../README.md.
[package]
name = "rusty_ffmpeg"
version = "0.17.0+ffmpeg.8.1"
authors = ["ldm0 <ldm2993593805@163.com>"]
edition = "2021"
description = "FFI bindings for FFmpeg 8.1 (rusty_ffmpeg 0.17.0), linked against the pinned static FFmpeg build."
license = "MIT"
links = "ffmpeg"
build = "build.rs"
publish = false

[lib]
doctest = false

# Its own workspace: vendored code stays out of the game's lints and tests.
[workspace]

[features]
ffmpeg5 = []
ffmpeg6 = ["ffmpeg5"]
ffmpeg6_1 = ["ffmpeg6"]
ffmpeg7 = ["ffmpeg6_1"]
ffmpeg7_1 = ["ffmpeg7"]
ffmpeg8 = ["ffmpeg7_1"]
ffmpeg8_1 = ["ffmpeg8"]
