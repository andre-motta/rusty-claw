[workspace]
resolver = "3"
members = [
    "engine/*",
    "app/*",
    "tools/*",
    "tests/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
claw-assets = { path = "engine/assets" }
claw-audio = { path = "engine/audio" }
claw-frame = { path = "engine/frame" }
claw-render = { path = "engine/render" }
claw-sim = { path = "engine/sim" }
claw-ui = { path = "engine/ui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proptest = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
